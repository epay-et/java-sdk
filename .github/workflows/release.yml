name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      # Read by Gradle as project properties. Kept at job level so the
      # preflight step can check them: the secrets context is not available
      # in a step-level `if`.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Maven Central versions are permanent: they can never be deleted or
      # overwritten. Everything below is checked before anything is uploaded.
      - name: Verify the tag matches both version declarations
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROPERTY=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          CONSTANT=$(grep -oE 'VERSION = "[^"]+"' epay-java/src/main/java/com/epayethiopia/epay/Epay.java | cut -d'"' -f2)
          echo "tag=$TAG gradle.properties=$PROPERTY Epay.VERSION=$CONSTANT"
          [ "$TAG" = "$PROPERTY" ] && [ "$TAG" = "$CONSTANT" ] || {
            echo "::error::tag, gradle.properties VERSION_NAME, and Epay.VERSION must all be $TAG"
            exit 1
          }

      - name: Check publishing credentials are configured
        run: |
          missing=""
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || missing="$missing SIGNING_KEY"
          [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the maven-central environment:$missing"
            echo "MAVEN_CENTRAL_* is a user token from central.sonatype.com -> View Account -> Generate User Token,"
            echo "not your login. SIGNING_KEY is the ASCII-armored private key: gpg --armor --export-secret-keys <id>"
            exit 1
          fi
          echo "All four publishing secrets are present"

      - name: Build and test
        run: ./gradlew build

      # Uploads both artifacts as one deployment, which Central validates
      # (signatures, POM metadata, sources and javadoc jars) and then releases.
      # A validation failure leaves nothing published.
      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
